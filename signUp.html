<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <!-- <link rel="text/javascript" href="login.js"> -->

</head>
<body>
    <div class="signup-container">
        <h1>signup</h1>
        <label for="stu">I am a student</label>
        <input type="radio" name="empOrStu" id="stu">
        <br>
        <label for="emp">I am an employer</label>
        <input type="radio" name="empOrStu" id="emp">
        <br>
        <label for="empEmail">Email:</label>
        <input type="text" name="" id="empEmail">
        <br>
        <label for="idNum">Choose a 5 digit ID number</label>
        <input type="number" name="" id="idNum"max="99999">
        <br>
        <label for="Pass">create a password</label>
        <input type="password" id="Pass">
        <br>
        <button id="create">Create Account</button>
    </div>
</body>
<script src="./JS/SignUp.js" type="module" defer></script>
</html>
