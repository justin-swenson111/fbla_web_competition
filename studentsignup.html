<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 50px;
            background-color: rgba(44, 62, 80, 0.7);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .navbar .logo {
            max-height: 50px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 15px;
            position: relative;
            transition: color 0.3s ease, background-color 0.3s ease;
        }

        .nav-links a:hover {
            background-color: rgba(44, 62, 80, 0.9);
            color: #f57f17;
        }

        .nav-links a:hover::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background-color: #f57f17;
            transition: width 0.3s ease;
            width: 100%;
        }

        .nav-links a.active {
            color: #f57f17;
        }

        .nav-links a.active::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background-color: #f57f17;
            width: 100%;
        }

        /* Background Section */
        .background {
            flex-grow: 1; /* Takes up space between nav and footer */
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url(https://educationsnapshots.com/wp-content/uploads/sites/4/2020/08/western-maricopa-education-center-northwest-campus-4.jpg);
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Signup Container */
        .signup-container {
            background-color: white;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
            margin: 20vh auto; /* Centered on the background */
        }

        .signup-container h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        /* Form Styles */
        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .name-row {
            display: flex;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #2c3e50;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #dcdcdc;
            border-radius: 5px;
            font-size: 16px;
            color: #333;
        }

        .form-group input:focus {
            border-color: #f57f17;
            outline: none;
        }

        /* Signup Button */
        .signup-btn {
            padding: 10px 20px;
            background-color: #f57f17;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .signup-btn:hover {
            background-color: #e65100;
        }

        /* Bottom Links */
        .bottom-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;

        }

        .bottom-links a {
            color: #f57f17;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .bottom-links a:hover {
            color: #2c3e50;
        }

        /* Footer */
      .footer {
        background-color: #1a2b4a;
        padding: 15px;
        text-align: center;
        color: white;
        font-family: Arial, sans-serif;
        width: 100%;
      }

      .footer-content {
        max-width: 1200px;
        margin: 0 auto;
      }

      .contact-info p {
        margin: 5px 0;
        font-size: 16px;
      }

      .social-media-icons {
        margin: 20px 0;
      }

      .social-media-icons a {
        margin: 0 10px;
        display: inline-block;
      }

      .social-media-icons img {
        width: 24px;
        height: 24px;
      }

      .footer-note p {
        font-size: 14px;
        margin-top: 20px;
      }

    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <a href="index.html">
            <img src="./media/logo.png" alt="Logo" class="logo" height="200px" width="auto" />
        </a>
        <div class="nav-links">
            <a href="aboutUs.html">About Us</a>
            <a href="resources.html">Resources</a>
            <a href="./login.html">Login</a>
        </div>
    </div>

    <!-- Background Section -->
    <div class="background">
        <div class="signup-container">
            <h1>Student Sign Up</h1>
            <!-- Updated form -->
            <form id="signup-form" class="signup-form" method="POST" action="signup.php" onsubmit="return validatePasswords()">
                <div class="name-row">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="fname" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="lname" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="repeat-password">Repeat Password</label>
                    <input type="password" id="repeat-password" name="repeat-password" required>
                </div>
                <p id="error-message" style="color: red; font-size: 14px; display: none;">Passwords do not match!</p>
                <button type="submit" class="signup-btn">Sign Up</button>
            </form>
            <div class="bottom-links">
                <a href="login.html" class="login">Login</a>
                <a href="employersignup.html" class="employer-signup">Employer Signup</a>
            </div>
        </div>
    </div>

    <footer class="footer" id="footer">
        <!-- Footer content remains unchanged -->
    </footer>

    <script>
        function validatePasswords() {
            const password = document.getElementById('password').value;
            const repeatPassword = document.getElementById('repeat-password').value;
            const errorMessage = document.getElementById('error-message');

            if (password !== repeatPassword) {
                errorMessage.style.display = 'block'; // Show error message
                return false; // Prevent form submission
            } else {
                errorMessage.style.display = 'none'; // Hide error message
                return true; // Allow form submission
            }
        }
    </script>
</body>

</html>
